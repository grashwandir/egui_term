[package]
name = "egui_term"
description = "Terminal emulator widget powered by EGUI framework and alacritty terminal backend."
authors = ["Ilya Shvyryalkin <ilyashvy@gmail.com>"]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/Harzu/egui_term"
categories = ["gui"]
license = "MIT"

[dependencies]
egui = "0.33"
alacritty_terminal = "0.25.1"
open = "5.3.2"

# Only compiled when building examples, never pulled into stratum_editor.
[dev-dependencies]
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "persistence"] }
egui_dock = "0.18.0"
env_logger = "0.11"
log = "0.4"
